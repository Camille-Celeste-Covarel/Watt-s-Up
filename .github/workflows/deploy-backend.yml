name: CI/CD for Wattsup BACKEND

on:
  push:
    branches:
      - staging
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches:
      - staging
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wattsup-backend
  APP_DIR_SNAILBACKEND: /home/deployer-back/wattsup

jobs:
  test:
    name: 🛡️ Lint and Test Code
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install all monorepo dependencies
        run: npm ci

      - name: Run all checks (lint, types, etc.)
        run: npm run check:all

      - name: 🛡️ Security Audit
        run: npm audit --audit-level=moderate

  build:
    name: Build and Push Backend Docker Image
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/staging') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.WATTSUP_DEPLOY }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,prefix=,suffix=-{{sha}},format=short

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to SnailBackend
    runs-on: ubuntu-latest
    needs: build
    environment: production-backend

    permissions:
      packages: read

    steps:
      - name: Deploy to SnailBackend via SnailFront (Jump Host)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SNAILFRONT_PRIVATE_IP }}
          username: ${{ secrets.SNAILFRONT_DEPLOY_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY_SNAILFRONT }}
          port: 96

          proxy_host: ${{ secrets.SNAILWEB_HOST }}
          proxy_username: ${{ secrets.SNAILWEB_DEPLOY_USERNAME }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY_SNAILWEB }}
          proxy_port: 96

          script: |
            set -euxo pipefail
            echo "--- Jumping to SnailBackend using pre-configured SSH alias 'snailback' ---"

            ssh snailback \
                "GH_OWNER='${{ github.repository_owner }}' \
                 IMAGE_NAME='${{ env.IMAGE_NAME }}' \
                 IMAGE_DIGEST='${{ needs.build.outputs.image-digest }}' \
                 GH_TOKEN='${{ secrets.WATTSUP_DEPLOY }}' \
                 GH_ACTOR='${{ github.actor }}' \
                 APP_DIR='${{ env.APP_DIR_SNAILBACKEND }}' \
                 DB_HOST_PROD='${{ secrets.DB_HOST_PROD }}' \
                 DB_USER_PROD='${{ secrets.DB_USER_PROD }}' \
                 DB_PASSWORD_PROD='${{ secrets.DB_PASSWORD_PROD }}' \
                 DB_NAME_PROD='${{ secrets.DB_NAME_PROD }}' \
                 DB_PORT_PROD='${{ secrets.DB_PORT_PROD }}' \
                 ADMIN_EMAIL_PROD='${{ secrets.ADMIN_EMAIL_PROD }}' \
                 ADMIN_PASSWORD_PROD='${{ secrets.ADMIN_PASSWORD_PROD }}' \
                 bash -s" <<-'EOF'
              set -euxo pipefail
              echo "--- Starting deployment on SnailBackend ---"

              # --- Variable Setup ---
              OWNER_LOWERCASE=$(echo "$GH_OWNER" | tr '[:upper:]' '[:lower:]')
              export IMAGE_TO_DEPLOY="ghcr.io/${OWNER_LOWERCASE}/${IMAGE_NAME}@${IMAGE_DIGEST}"
              export CONTAINER_NAME="wattsup-backend"

              echo "Details: Image=$IMAGE_TO_DEPLOY, Container=$CONTAINER_NAME, AppDir=$APP_DIR"

              # --- Docker Login ---
              echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

              # --- Prepare Deployment Directory ---
              mkdir -p "$APP_DIR"
              cd "$APP_DIR"

              # --- Create docker-compose.prod.yml ---
              echo "Creating docker-compose.prod.yml..."
              cat <<- ECOMP > docker-compose.prod.yml
              services:
                backend:
                  image: ${IMAGE_TO_DEPLOY}
                  container_name: ${CONTAINER_NAME}
                  restart: unless-stopped
                  ports:
                    - "3310:3310"
                  env_file:
                    - .env
                  volumes:
                    - ./logs:/app/logs
                    - csv_cache_volume:/app/CSVCache
                  healthcheck:
                    test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3310/api/v1/health || exit 1"]
                    interval: 30s
                    timeout: 10s
                    retries: 3
                    start_period: 10s
              
              volumes:
                csv_cache_volume:
                  driver: local
              ECOMP

              # --- Create .env file for production ---
              echo "Creating .env file..."
              cat <<- EENV > .env
              # Auto-generated by GitHub Actions
              PORT=3310
              LOG_DIR=/app/log
              LOG_LEVEL=INFO
              DB_HOST=${DB_HOST_PROD}
              DB_USER=${DB_USER_PROD}
              DB_PASSWORD=${DB_PASSWORD_PROD}
              DB_NAME=${DB_NAME_PROD}
              DB_PORT=${DB_PORT_PROD}
              ADMIN_EMAIL=${ADMIN_EMAIL_PROD}
              ADMIN_PASSWORD=${ADMIN_PASSWORD_PROD}
              EENV

              # --- Deploy with Docker Compose ---
              echo "Pulling the new image..."
              docker compose -f docker-compose.prod.yml pull

              echo "Stopping and restarting container..."
              docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans

              echo "Cleaning up old Docker images..."
              docker image prune -af

              echo "Logging out..."
              docker logout ghcr.io

              echo "--- Backend deployment finished successfully ---"
            EOF

            echo "--- Remote script execution finished ---"
