name: CI/CD for Wattsup BACKEND

on:
  push:
    branches:
      - staging
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches:
      - staging
    paths:
      - 'server/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: wattsup-backend
  APP_DIR_SNAILBACKEND: /home/deployer-back/wattsup

jobs:
  test:
    name: 🛡️ Lint and Test Code
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install all monorepo dependencies
        run: npm ci

      - name: Run all checks (lint, types, etc.)
        run: npm run check

      - name: 🛡️ Security Audit
        run: npm audit --audit-level=high

  build:
    name: Build and Push Docker Image
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/staging') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with: 
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.WATTSUP_DEPLOY }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=true
            type=sha,prefix=,suffix=-{{sha}},format=short

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to SnailBackend
    runs-on: ubuntu-latest
    needs: build
    environment: production-backend

    permissions:
      packages: read

    steps:
      - name: Deploy to SnailBackend via SnailFront (Jump Host)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SNAILFRONT_PRIVATE_IP }}
          username: ${{ secrets.SNAILFRONT_DEPLOY_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY_SNAILFRONT }}
          port: 96

          proxy_host: ${{ secrets.SNAILWEB_HOST }}
          proxy_username: ${{ secrets.SNAILWEB_DEPLOY_USERNAME }}
          proxy_key: ${{ secrets.SSH_PRIVATE_KEY_SNAILWEB }}
          proxy_port: 96

          script: |
            set -euxo pipefail
            echo "--- Jumping to SnailBackend using pre-configured SSH alias 'snailback' ---"

            ssh snailback 'bash -s' <<-'EOF'
              set -euxo pipefail

              export GH_OWNER='${{ github.repository_owner }}'
              export IMAGE_NAME='${{ env.IMAGE_NAME }}'
              export IMAGE_DIGEST='${{ needs.build.outputs.image-digest }}'
              export GH_TOKEN='${{ secrets.WATTSUP_DEPLOY }}'
              export GH_ACTOR='${{ github.actor }}'
              export APP_DIR='${{ env.APP_DIR_SNAILBACKEND }}'
              export DB_HOST_PROD='${{ secrets.DB_HOST_PROD }}'
              export DB_USER_PROD='${{ secrets.DB_USER_PROD }}'
              export DB_PASSWORD_PROD='${{ secrets.DB_PASSWORD_PROD }}'
              export DB_NAME_PROD='${{ secrets.DB_NAME_PROD }}'
              export DB_PORT_PROD='${{ secrets.DB_PORT_PROD }}'
              export ADMIN_EMAIL_PROD='${{ secrets.ADMIN_EMAIL_PROD }}'
              export ADMIN_PASSWORD_PROD='${{ secrets.ADMIN_PASSWORD_PROD }}'
              export JWT_SECRET_PROD='${{ secrets.JWT_SECRET }}'

              echo "--- Starting deployment on SnailBackend ---"

              OWNER_LOWERCASE=$(echo "$GH_OWNER" | tr '[:upper:]' '[:lower:]')
              export IMAGE_TO_DEPLOY="ghcr.io/${OWNER_LOWERCASE}/${IMAGE_NAME}@${IMAGE_DIGEST}"
              export CONTAINER_NAME="wattsup-backend"

              echo "Details: Image=$IMAGE_TO_DEPLOY, Container=$CONTAINER_NAME, AppDir=$APP_DIR"

              echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

              mkdir -p "$APP_DIR"
              cd "$APP_DIR"

              echo "Creating docker-compose-backend.yml..."
              echo "services:" > docker-compose-backend.yml
              echo "  backend:" >> docker-compose-backend.yml
              echo "    image: ${IMAGE_TO_DEPLOY}" >> docker-compose-backend.yml
              echo "    container_name: ${CONTAINER_NAME}" >> docker-compose-backend.yml
              echo "    restart: unless-stopped" >> docker-compose-backend.yml
              echo "    ports:" >> docker-compose-backend.yml
              echo "      - \"3310:3310\"" >> docker-compose-backend.yml
              echo "    env_file:" >> docker-compose-backend.yml
              echo "      - .env" >> docker-compose-backend.yml
              echo "    volumes:" >> docker-compose-backend.yml
              echo "      - ./logs:/app/logs" >> docker-compose-backend.yml
              echo "      - csv_cache_volume:/app/CSVCache" >> docker-compose-backend.yml
              echo "      - public_uploads_volume:/app/public/uploads" >> docker-compose-backend.yml
              echo "    networks:" >> docker-compose-backend.yml
              echo "      - wattsup-network" >> docker-compose-backend.yml
              echo "    healthcheck:" >> docker-compose-backend.yml
              echo "      test: [\"CMD-SHELL\", \"wget --quiet --tries=1 --spider http://localhost:3310/api/v1/health || exit 1\"]" >> docker-compose-backend.yml
              echo "      interval: 30s" >> docker-compose-backend.yml
              echo "      timeout: 10s" >> docker-compose-backend.yml
              echo "      retries: 3" >> docker-compose-backend.yml
              echo "      start_period: 10s" >> docker-compose-backend.yml
              echo "" >> docker-compose-backend.yml
              echo "volumes:" >> docker-compose-backend.yml
              echo "  csv_cache_volume:" >> docker-compose-backend.yml
              echo "    driver: local" >> docker-compose-backend.yml
              echo "  public_uploads_volume:" >> docker-compose-backend.yml
              echo "" >> docker-compose-backend.yml
              echo "networks:" >> docker-compose-backend.yml
              echo "  wattsup-network:" >> docker-compose-backend.yml
              echo "    external: true" >> docker-compose-backend.yml

              echo "Creating .env file..."
              echo "PORT=3310" > .env
              echo "LOG_DIR=/app/log" >> .env
              echo "LOG_LEVEL=INFO" >> .env
              echo "DB_HOST=${DB_HOST_PROD}" >> .env
              echo "DB_USER=${DB_USER_PROD}" >> .env
              echo "DB_PASSWORD=${DB_PASSWORD_PROD}" >> .env
              echo "DB_NAME=${DB_NAME_PROD}" >> .env
              echo "DB_PORT=${DB_PORT_PROD}" >> .env
              echo "DB_DIALECT=postgres" >> .env
              echo "CLIENT_URL=https://watts-up.anamnesis.ovh" >> .env
              echo "ADMIN_EMAIL=${ADMIN_EMAIL_PROD}" >> .env
              echo "ADMIN_PASSWORD=${ADMIN_PASSWORD_PROD}" >> .env
              echo "JWT_SECRET=${JWT_SECRET_PROD}" >> .env

              echo "Pulling the new image..."
              docker compose -f docker-compose-backend.yml pull

              echo "Stopping and restarting container..."
              docker compose -f docker-compose-backend.yml up -d --force-recreate --remove-orphans

              echo "Cleaning up old Docker images..."
              docker image prune -af

              docker logout ghcr.io

              echo "--- Backend deployment finished successfully ---"
            EOF

            echo "--- Remote script execution finished ---"
